<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بطولة الرياضيات</title><style>html,body{margin:0;height:100%;background:#073f2d;font-family:Tahoma,Arial,sans-serif}#status{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;background:#063d2b;color:#fff;border:2px solid #e8bd45;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 5px 18px #0006}#status.err{background:#a92635}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><div id="status">☁️ جارٍ تحميل الحفظ السحابي...</div><iframe id="quiz" title="بطولة الرياضيات"></iframe><script>const STORE='mathFootballQuiz_v4';const API='https://eydxburozlqoxuvavuzi.supabase.co/functions/v1/football-quiz-sync';const status=document.getElementById('status');const frame=document.getElementById('quiz');const base='/football-math-quiz-v2/?cloud=1';let last='';function setStatus(t,e=false){status.textContent=t;status.classList.toggle('err',e)}async function cloudGet(){const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('get');return r.json()}async function cloudPut(raw){const state=JSON.parse(raw||'{}');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})});if(!r.ok)throw new Error('put')}async function boot(){try{const remote=await cloudGet();const remoteRaw=remote&&remote.state?JSON.stringify(remote.state):'';const localRaw=localStorage.getItem(STORE)||'';const localObj=localRaw?JSON.parse(localRaw):null;const localHas=!!(localObj&&localObj.questions&&Object.keys(localObj.questions).length);const remoteHas=!!(remote&&remote.state&&remote.state.questions&&Object.keys(remote.state.questions).length);if(remoteHas){localStorage.setItem(STORE,remoteRaw);last=remoteRaw}else if(localHas){await cloudPut(localRaw);last=localRaw}else{last=localRaw}setStatus('☁️ متصل بالحفظ السحابي');}catch(e){setStatus('تعذر الاتصال بالسحابة — سيعمل الحفظ المحلي',true)}frame.src=base;setTimeout(()=>status.style.opacity='.65',1800);setInterval(sync,900)}async function sync(){const raw=localStorage.getItem(STORE)||'';if(!raw||raw===last)return;last=raw;setStatus('☁️ جارٍ الحفظ...');try{await cloudPut(raw);setStatus('☁️ محفوظ سحابيًا')}catch(e){setStatus('تعذر الحفظ السحابي',true)}}window.addEventListener('storage',sync);boot();</script></body></html>
