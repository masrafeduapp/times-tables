<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مسابقات كرة الرياضيات</title><style>html,body{margin:0;min-height:100%;background:#062b21;font-family:Tahoma,Arial,sans-serif;color:#fff}body{display:flex;justify-content:center}.app{width:min(100%,1600px);padding:8px}.stage{position:relative;width:100%;aspect-ratio:16/9;background:url('/football-math-quiz/template.jpg') center/contain no-repeat}.editable{position:absolute;left:17%;right:13%;top:40%;bottom:17%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#111;font-size:clamp(26px,3vw,58px);font-weight:800;line-height:1.5;outline:none;overflow:auto}.editable:empty:before{content:'اكتبي السؤال هنا أو الصقي النص';color:#888;font-weight:600}.question-img{position:absolute;left:19%;right:15%;top:41%;bottom:19%;display:none;align-items:center;justify-content:center}.question-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;background:#fff}.score{position:absolute;top:14%;width:6.2%;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;font-size:clamp(28px,4vw,70px);font-weight:900;color:#fff;background:rgba(0,0,0,.75)}#s0{left:32.7%}#s1{left:53.9%}#s2{left:74.9%}.hotspot{position:absolute;top:4%;height:23%;cursor:pointer;border-radius:18px}.h0{left:20%;width:21%}.h1{left:41.5%;width:21%}.h2{left:63%;width:21%}.hotspot.sel{outline:6px solid rgba(255,255,255,.95);outline-offset:-6px}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.toolbar button,.toolbar label{background:#0b5a3b;color:#fff;border:2px solid #e1b83e;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:900;cursor:pointer}.toolbar input[type=file]{display:none}.overlay{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:30;padding:20px}.overlay.show{display:grid}.modal{width:min(700px,94vw);background:#073b2c;border:4px solid #e0b43d;border-radius:26px;padding:26px;text-align:center}.goalbox{height:250px;background:linear-gradient(#0d69b2 0 62%,#148547 62%);border-radius:18px;position:relative;overflow:hidden}.net{position:absolute;left:15%;right:15%;bottom:18%;height:48%;border:7px solid #fff;border-radius:8px 8px 0 0}.ball{position:absolute;left:calc(50% - 35px);bottom:18px;font-size:70px;transition:1s}.ball.go{transform:translate(170px,-125px) rotate(600deg) scale(.7)}.goalBtn{background:#12a85a!important}.missBtn{background:#c92335!important}.win{font-size:72px;color:#ffd34d;font-weight:1000}.qbadge{position:absolute;top:30.3%;left:43%;width:16%;text-align:center;font-size:clamp(20px,2.5vw,42px);font-weight:900;color:#fff;pointer-events:none}.mobileNote{font-size:14px;opacity:.8;text-align:center}@media(max-width:800px){.app{padding:0}.toolbar button,.toolbar label{font-size:15px;padding:8px 11px}.editable{left:15%;right:11%;top:39%;bottom:16%;font-size:clamp(20px,4vw,38px);padding:10px}.question-img{left:16%;right:12%;top:39%;bottom:17%}.score{top:14%;font-size:clamp(20px,5vw,44px)}.qbadge{top:30%;font-size:clamp(18px,4vw,32px)}}</style></head><body><div class="app"><div class="toolbar"><button id="textMode">✍️ كتابة السؤال</button><label>🖼️ إضافة صورة<input id="file" type="file" accept="image/*"></label><button id="pasteImage">📋 لصق صورة</button><button id="clear">🧹 مسح</button><button id="shoot">⚽ سدد</button><button id="next">التالي</button><button id="reset">إعادة النتائج</button></div><div class="mobileNote">اختاري الفريق من صورته بالأعلى، ثم اكتبي السؤال أو أضيفي صورة.</div><div class="stage"><div class="qbadge" id="qbadge">السؤال ١</div><div class="hotspot h0 sel" data-i="0"></div><div class="hotspot h1" data-i="1"></div><div class="hotspot h2" data-i="2"></div><div class="score" id="s0">٠</div><div class="score" id="s1">٠</div><div class="score" id="s2">٠</div><div class="editable" id="editor" contenteditable="true"></div><div class="question-img" id="imgWrap"><img id="qimg"></div></div></div><div class="overlay" id="kick"><div class="modal"><h1 id="teamTitle"></h1><div class="goalbox"><div class="net"></div><div class="ball" id="ball">⚽</div></div><div class="toolbar"><button class="goalBtn" id="goal">🥅 هدف!</button><button class="missBtn" id="miss">✖ ضاعت</button></div></div></div><div class="overlay" id="win"><div class="modal"><div>🎉✨🏆✨🎉</div><div class="win">هـدف!</div><h1 id="winner"></h1><button id="continueBtn">السؤال التالي ←</button></div></div><script>const names=['مجموعة سالم الدوسري','مجموعة رونالدو','مجموعة مبابي'];let scores=[0,0,0],team=0,q=1;const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function render(){scores.forEach((v,i)=>document.getElementById('s'+i).textContent=ar(v));document.querySelectorAll('.hotspot').forEach((e,i)=>e.classList.toggle('sel',i===team));qbadge.textContent='السؤال '+ar(q)}document.querySelectorAll('.hotspot').forEach(e=>e.onclick=()=>{team=+e.dataset.i;render()});function showText(){editor.style.display='flex';imgWrap.style.display='none'}function showImg(src){qimg.src=src;imgWrap.style.display='flex';editor.style.display='none'}textMode.onclick=showText;file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>showImg(r.result);r.readAsDataURL(f)};pasteImage.onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){const blob=await item.getType(type);showImg(URL.createObjectURL(blob));return}}alert('لا توجد صورة في الحافظة')}catch(e){alert('استخدمي زر إضافة صورة إذا منع المتصفح اللصق')}};document.addEventListener('paste',e=>{for(const it of e.clipboardData.items){if(it.type.startsWith('image/')){const f=it.getAsFile();showImg(URL.createObjectURL(f));e.preventDefault();break}}});clear.onclick=()=>{editor.innerHTML='';qimg.removeAttribute('src');showText()};shoot.onclick=()=>{teamTitle.textContent=names[team];kick.classList.add('show');ball.classList.remove('go');setTimeout(()=>ball.classList.add('go'),60)};goal.onclick=()=>{scores[team]++;kick.classList.remove('show');winner.textContent='ممتاز! '+names[team];win.classList.add('show');render()};function advance(){q++;team=(team+1)%3;editor.innerHTML='';qimg.removeAttribute('src');showText();render()}miss.onclick=()=>{kick.classList.remove('show');advance()};continueBtn.onclick=()=>{win.classList.remove('show');advance()};next.onclick=advance;reset.onclick=()=>{scores=[0,0,0];team=0;q=1;editor.innerHTML='';qimg.removeAttribute('src');showText();render()};render();</script></body></html>
