<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مسابقات كرة الرياضيات</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#071b16;color:#fff}body{display:flex;justify-content:center;align-items:flex-start}.app{width:min(100%,1600px);padding:10px 10px 90px}.top{display:flex;justify-content:center;align-items:center;margin:4px 0 10px}.mode-pill{background:rgba(5,54,38,.92);border:2px solid #e7bd47;border-radius:999px;padding:9px 18px;font-weight:900;box-shadow:0 8px 26px #0006}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:18px;box-shadow:0 18px 55px #0009;background:#0a3126}.stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.score{position:absolute;top:13.6%;width:5.8%;aspect-ratio:1/1;border-radius:13px;display:grid;place-items:center;font-size:clamp(26px,4vw,68px);font-weight:900;color:#fff;background:rgba(5,10,12,.72);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);z-index:4}.s0{left:33.15%}.s1{left:54.15%}.s2{left:75.15%}.team-hit{position:absolute;top:3.8%;height:23.5%;width:20.5%;z-index:6;cursor:pointer;border-radius:18px}.h0{left:20.3%}.h1{left:41.6%}.h2{left:62.9%}.team-hit.selected{outline:5px solid #fff;outline-offset:-6px;filter:drop-shadow(0 0 12px #fff8)}.qnum{position:absolute;top:29.2%;left:43%;width:14%;text-align:center;color:#fff;font-size:clamp(18px,2.25vw,38px);font-weight:900;z-index:6;text-shadow:0 2px 5px #0008}.content{position:absolute;left:18.2%;right:14.2%;top:39.2%;bottom:18.8%;z-index:5;display:flex;align-items:center;justify-content:center}.editor{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 28px;color:#111;font-size:clamp(28px,3vw,56px);font-weight:800;line-height:1.55;outline:none;overflow:auto;border-radius:20px}.editor:empty:before{content:'اضغطي هنا واكتبي السؤال أو الصقيه';color:#777;font-weight:600}.editor.editing{box-shadow:inset 0 0 0 3px rgba(20,120,85,.28);background:rgba(255,255,255,.12)}.img-wrap{width:100%;height:100%;display:none;align-items:center;justify-content:center}.img-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;background:#fff}.floating{position:fixed;z-index:25;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(4,41,29,.95);border:2px solid #e5bd46;border-radius:20px;padding:8px;box-shadow:0 12px 35px #0009;backdrop-filter:blur(10px)}button,.file-label{border:0;border-radius:14px;padding:11px 15px;font-size:17px;font-weight:900;cursor:pointer;white-space:nowrap}.primary{background:#116fdf;color:#fff}.gold{background:#e5b83d;color:#173021}.ghost{background:#0d5a3f;color:#fff;border:1px solid #ffffff35}.file-label{background:#0d5a3f;color:#fff;border:1px solid #ffffff35}.file-label input{display:none}.panel{position:fixed;z-index:24;left:50%;bottom:78px;transform:translateX(-50%) translateY(18px);width:min(92vw,860px);background:rgba(7,44,32,.97);border:2px solid #e5bd46;border-radius:24px;padding:14px;box-shadow:0 16px 45px #000b;opacity:0;pointer-events:none;transition:.2s}.panel.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}.panel-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hint{text-align:center;font-size:14px;opacity:.85;margin-top:8px}.overlay{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:40;padding:20px}.overlay.show{display:grid}.modal{width:min(720px,94vw);background:#073b2c;border:4px solid #e9bd3f;border-radius:28px;padding:26px;text-align:center}.goalbox{height:260px;background:linear-gradient(#0d69b2 0 62%,#148547 62%);border-radius:18px;position:relative;overflow:hidden;margin:15px 0}.net{position:absolute;left:15%;right:15%;bottom:18%;height:48%;border:7px solid #fff;border-radius:8px 8px 0 0}.ball{position:absolute;left:calc(50% - 35px);bottom:18px;font-size:70px;transition:1s}.ball.go{transform:translate(170px,-125px) rotate(600deg) scale(.7)}.goalBtn{background:#12a85a;color:#fff}.missBtn{background:#c92335;color:#fff}.winTitle{font-size:clamp(54px,8vw,92px);color:#ffd34f;font-weight:1000}.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.modal-actions button{min-width:160px}.toast{position:fixed;z-index:60;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:#0a5d40;color:#fff;border:2px solid #e5bd46;border-radius:14px;padding:10px 18px;font-weight:900;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-width:850px){.app{padding:4px 4px 86px}.top{display:none}.stage{border-radius:0;box-shadow:none}.floating{width:calc(100% - 14px);justify-content:space-between;gap:6px;padding:7px}.floating button{font-size:15px;padding:10px 12px}.panel{bottom:72px}.editor{font-size:clamp(21px,4.2vw,39px);padding:12px}.score{font-size:clamp(20px,4.4vw,44px);border-radius:8px}.team-hit.selected{outline-width:3px}.qnum{font-size:clamp(17px,3.5vw,29px)}}@media(max-width:560px){.floating .hide-sm{display:none}.floating button{flex:1}.content{left:16.5%;right:12%;top:38.5%;bottom:17.5%}}</style></head><body><div class="app"><div class="top"><div class="mode-pill">⚽ بطولة الرياضيات — أ. سارة بنت مداوي حقوي</div></div><div class="stage"><img class="stage-bg" src="./template.jpg?v=10" alt="قالب بطولة الرياضيات"><div class="qnum" id="qnum">السؤال ١</div><div class="team-hit h0 selected" data-team="0" aria-label="مجموعة سالم الدوسري"></div><div class="team-hit h1" data-team="1" aria-label="مجموعة رونالدو"></div><div class="team-hit h2" data-team="2" aria-label="مجموعة مبابي"></div><div class="score s0" id="s0">٠</div><div class="score s1" id="s1">٠</div><div class="score s2" id="s2">٠</div><div class="content"><div id="editor" class="editor" contenteditable="true"></div><div id="imgWrap" class="img-wrap"><img id="qimg" alt="صورة السؤال"></div></div></div></div><div class="panel" id="panel"><div class="panel-row"><button class="ghost" id="textMode">✍️ كتابة / لصق نص</button><label class="file-label">🖼️ إضافة صورة<input id="file" type="file" accept="image/*"></label><button class="ghost" id="pasteImage">📋 لصق صورة</button><button class="ghost" id="smaller">أ−</button><button class="ghost" id="bigger">أ+</button><button class="ghost" id="clear">🧹 مسح السؤال</button></div><div class="hint">اختاري الفريق من صورته في الأعلى، ثم أضيفي السؤال داخل المساحة البيضاء.</div></div><div class="floating"><button class="gold" id="editBtn">✏️ إعداد السؤال</button><button class="primary" id="shoot">⚽ سدد</button><button class="ghost hide-sm" id="next">التالي</button><button class="ghost hide-sm" id="reset">إعادة النتائج</button></div><div class="overlay" id="kick"><div class="modal"><h1 id="teamTitle"></h1><div class="goalbox"><div class="net"></div><div class="ball" id="ball">⚽</div></div><div class="modal-actions"><button class="goalBtn" id="goal">🥅 هدف!</button><button class="missBtn" id="miss">✖ ضاعت التسديدة</button></div></div></div><div class="overlay" id="win"><div class="modal"><div style="font-size:36px">🎉✨🏆✨🎉</div><div class="winTitle">هـدف!</div><h1 id="winner"></h1><p>تمت إضافة نقطة للفريق</p><button class="primary" id="continueBtn">السؤال التالي ←</button></div></div><div class="toast" id="toast"></div><script>const names=['مجموعة سالم الدوسري','مجموعة رونالدو','مجموعة مبابي'];let scores=[0,0,0],team=0,q=1,fontScale=1;const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);const el=id=>document.getElementById(id);function toastMsg(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}function render(){scores.forEach((v,i)=>el('s'+i).textContent=ar(v));document.querySelectorAll('.team-hit').forEach((e,i)=>e.classList.toggle('selected',i===team));qnum.textContent='السؤال '+ar(q)}document.querySelectorAll('.team-hit').forEach(e=>e.onclick=()=>{team=+e.dataset.team;render();toastMsg(names[team])});function showText(){imgWrap.style.display='none';editor.style.display='flex';editor.classList.add('editing');editor.focus()}function showImage(src){qimg.src=src;imgWrap.style.display='flex';editor.style.display='none';panel.classList.remove('show')}editBtn.onclick=()=>panel.classList.toggle('show');textMode.onclick=()=>{showText();panel.classList.remove('show')};file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>showImage(r.result);r.readAsDataURL(f)};pasteImage.onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){const blob=await item.getType(type);showImage(URL.createObjectURL(blob));return}}toastMsg('لا توجد صورة في الحافظة')}catch(err){toastMsg('استخدمي إضافة صورة من الجهاز')}};document.addEventListener('paste',e=>{for(const it of e.clipboardData.items){if(it.type.startsWith('image/')){const f=it.getAsFile();showImage(URL.createObjectURL(f));e.preventDefault();return}}});bigger.onclick=()=>{fontScale=Math.min(1.7,fontScale+.1);editor.style.transform='scale('+fontScale+')'};smaller.onclick=()=>{fontScale=Math.max(.65,fontScale-.1);editor.style.transform='scale('+fontScale+')'};clear.onclick=()=>{editor.innerHTML='';qimg.removeAttribute('src');showText();fontScale=1;editor.style.transform='scale(1)'};shoot.onclick=()=>{panel.classList.remove('show');editor.classList.remove('editing');teamTitle.textContent=names[team];kick.classList.add('show');ball.classList.remove('go');setTimeout(()=>ball.classList.add('go'),70)};goal.onclick=()=>{scores[team]++;kick.classList.remove('show');winner.textContent='ممتاز! '+names[team];win.classList.add('show');render()};function advance(){q++;team=(team+1)%3;editor.innerHTML='';qimg.removeAttribute('src');imgWrap.style.display='none';editor.style.display='flex';editor.classList.remove('editing');fontScale=1;editor.style.transform='scale(1)';render()}miss.onclick=()=>{kick.classList.remove('show');advance()};continueBtn.onclick=()=>{win.classList.remove('show');advance()};next.onclick=advance;reset.onclick=()=>{if(confirm('هل تريدين إعادة النتائج؟')){scores=[0,0,0];team=0;q=1;editor.innerHTML='';qimg.removeAttribute('src');imgWrap.style.display='none';editor.style.display='flex';render()}};render();</script></body></html>
