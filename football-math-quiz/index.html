<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مسابقات كرة الرياضيات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(#0756a0 0 45%,#087238 45%);min-height:100vh;color:#fff}.app{max-width:1500px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{background:#063d2b;border:3px solid #e9bd3f;border-radius:18px;padding:10px 16px;font-weight:900}.title{font-size:clamp(24px,3vw,38px);color:#ffd85b}.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.team{padding:10px;border-radius:18px;text-align:center;font-weight:900;cursor:pointer;border:4px solid transparent;box-shadow:0 8px 20px #0006}.team.sel{border-color:#fff;transform:translateY(-3px)}.blue{background:#075ad8}.yellow{background:#f4c20e;color:#111}.red{background:#c71931}.score{font-size:46px;background:#111b;border-radius:12px;margin:5px auto;width:82px;color:#fff}.stage{background:#042d20;border:4px solid #e4b83e;border-radius:24px;padding:12px;box-shadow:0 12px 35px #0008}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}button,.filelabel{border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:900;cursor:pointer;background:#fff;color:#123}.primary{background:#0e70ef;color:#fff}.green{background:#0f9f58;color:#fff}.redbtn{background:#c82c3e;color:#fff}.dark{background:#17392e;color:#fff;border:1px solid #ffffff55}.wrap{position:relative;width:100%;aspect-ratio:16/9;background:#0a442e center/contain no-repeat;border-radius:18px;overflow:hidden}.editor{position:absolute;left:11%;right:11%;top:38%;bottom:19%;display:flex;align-items:center;justify-content:center;text-align:center;color:#111;font-size:clamp(20px,3vw,44px);font-weight:800;line-height:1.65;padding:2%;overflow:auto;background:rgba(255,255,255,.03);outline:2px dashed rgba(11,96,63,.18)}.editor:focus{outline:3px dashed #0b7d50;background:rgba(255,255,255,.18)}.editor:empty:before{content:'اكتبي السؤال هنا أو الصقيه أو أضيفي صورة';color:#777;font-size:clamp(16px,2.2vw,28px);font-weight:600}.editor img{max-width:96%;max-height:96%;object-fit:contain;display:block;margin:auto}.hidden{display:none}.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:50}.overlay.show{display:grid}.modal{width:min(760px,96vw);background:#063d2b;border:4px solid #e9bd3f;border-radius:28px;padding:24px;text-align:center}.ball{font-size:90px;display:inline-block}.shooting{animation:kick 1s ease-in-out}@keyframes kick{50%{transform:translate(160px,-90px) rotate(500deg) scale(.7)}}.win{font-size:64px;color:#ffd34f;font-weight:1000}@media(max-width:760px){.teams{grid-template-columns:repeat(3,1fr);gap:5px}.team{font-size:12px;padding:6px}.score{font-size:30px;width:56px}.toolbar button,.filelabel{font-size:13px;padding:9px 10px}.editor{font-size:19px}}</style></head><body><div class="app"><div class="top"><div class="badge title">⚽ مسابقات كرة الرياضيات</div><div class="badge">👑 أ. سارة بنت مداوي حقوي</div></div><div class="teams"><div class="team blue sel" data-i="0">مجموعة سالم الدوسري<div class="score" id="s0">٠</div></div><div class="team yellow" data-i="1">مجموعة رونالدو<div class="score" id="s1">٠</div></div><div class="team red" data-i="2">مجموعة مبابي<div class="score" id="s2">٠</div></div></div><section class="stage"><div class="toolbar"><button id="textBtn">✍️ كتابة السؤال</button><label class="filelabel">🖼️ إضافة صورة<input class="hidden" id="imgInput" type="file" accept="image/*"></label><button id="pasteBtn">📋 لصق</button><button class="dark" id="smaller">A−</button><button class="dark" id="larger">A+</button><button class="redbtn" id="clear">🗑️ مسح السؤال</button></div><div class="wrap" id="wrap"><div id="editor" class="editor" contenteditable="true" spellcheck="false"></div></div><div class="actions"><button class="green" id="saveQ">💾 حفظ السؤال</button><button class="primary" id="shoot">⚽ سدد</button><button class="dark" id="newQ">➕ سؤال جديد</button></div></section></div><div class="overlay" id="kick"><div class="modal"><h1 id="kt"></h1><div class="ball" id="ball">⚽</div><h2>نتيجة التسديدة</h2><div class="actions"><button class="green" id="goal">🥅 هدف!</button><button class="redbtn" id="miss">✖ ضاعت التسديدة</button></div></div></div><div class="overlay" id="win"><div class="modal"><div>🎉✨🏆✨🎉</div><div class="win">هـدف!</div><h1 id="wt"></h1><p>تمت إضافة نقطة للفريق</p><button class="primary" id="cont">السؤال التالي ←</button></div></div><script>fetch('blank-template-b64.txt').then(r=>r.text()).then(b=>wrap.style.backgroundImage=`url(data:image/jpeg;base64,${b.trim()})`);const names=['مجموعة سالم الدوسري','مجموعة رونالدو','مجموعة مبابي'];let sc=JSON.parse(localStorage.getItem('footballScores')||'[0,0,0]'),t=+(localStorage.getItem('footballTeam')||0),qIndex=+(localStorage.getItem('footballQIndex')||0),fs=44;const ed=editor,ar=x=>String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function render(){document.querySelectorAll('.team').forEach((e,k)=>e.classList.toggle('sel',k===t));sc.forEach((x,k)=>document.getElementById('s'+k).textContent=ar(x));localStorage.setItem('footballScores',JSON.stringify(sc));localStorage.setItem('footballTeam',t)}document.querySelectorAll('.team').forEach(e=>e.onclick=()=>{t=+e.dataset.i;render()});textBtn.onclick=()=>ed.focus();imgInput.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{ed.innerHTML='<img src="'+r.result+'">';saveDraft()};r.readAsDataURL(f)};pasteBtn.onclick=async()=>{ed.focus();try{let items=await navigator.clipboard.read();for(let item of items)for(let type of item.types)if(type.startsWith('image/')){let blob=await item.getType(type),r=new FileReader();r.onload=()=>{ed.innerHTML='<img src="'+r.result+'">';saveDraft()};r.readAsDataURL(blob);return}let txt=await navigator.clipboard.readText();if(txt){ed.innerText=txt;saveDraft()}}catch(e){alert('اضغطي داخل المساحة البيضاء ثم اختاري لصق من لوحة المفاتيح.')}};ed.addEventListener('paste',e=>{for(let it of e.clipboardData?.items||[])if(it.type.startsWith('image/')){e.preventDefault();let r=new FileReader();r.onload=()=>{ed.innerHTML='<img src="'+r.result+'">';saveDraft()};r.readAsDataURL(it.getAsFile());return}setTimeout(saveDraft,0)});ed.addEventListener('input',saveDraft);function saveDraft(){localStorage.setItem('footballDraft',ed.innerHTML)}ed.innerHTML=localStorage.getItem('footballDraft')||'';larger.onclick=()=>{fs=Math.min(72,fs+4);ed.style.fontSize=fs+'px'};smaller.onclick=()=>{fs=Math.max(18,fs-4);ed.style.fontSize=fs+'px'};clear.onclick=()=>{if(confirm('مسح السؤال الحالي؟')){ed.innerHTML='';saveDraft()}};saveQ.onclick=()=>{let bank=JSON.parse(localStorage.getItem('footballQuestions')||'[]');bank[qIndex]=ed.innerHTML;localStorage.setItem('footballQuestions',JSON.stringify(bank));alert('تم حفظ السؤال '+ar(qIndex+1))};newQ.onclick=()=>{let bank=JSON.parse(localStorage.getItem('footballQuestions')||'[]');bank[qIndex]=ed.innerHTML;qIndex++;localStorage.setItem('footballQuestions',JSON.stringify(bank));localStorage.setItem('footballQIndex',qIndex);ed.innerHTML=bank[qIndex]||'';saveDraft();t=(t+1)%3;render()};shoot.onclick=()=>{kt.textContent=names[t];kick.classList.add('show');ball.classList.remove('shooting');setTimeout(()=>ball.classList.add('shooting'),50)};goal.onclick=()=>{sc[t]++;kick.classList.remove('show');wt.textContent='ممتاز! '+names[t];win.classList.add('show');render()};miss.onclick=()=>{kick.classList.remove('show');newQ.click()};cont.onclick=()=>{win.classList.remove('show');newQ.click()};render();</script></body></html>
