<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مسابقات كرة الرياضيات</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#071b16;color:#fff}body{display:flex;justify-content:center}.app{width:min(100%,1500px);padding:12px 12px 95px}.header{text-align:center;margin:4px 0 12px}.title{display:inline-block;background:#063d2b;border:2px solid #e6bb43;border-radius:999px;padding:10px 22px;font-size:clamp(20px,2.2vw,34px);font-weight:900;color:#ffd859}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 14px}.player{position:relative;min-height:165px;border-radius:22px;overflow:hidden;border:4px solid transparent;cursor:pointer;box-shadow:0 10px 28px #0007;background:#123}.player.selected{border-color:#fff;transform:translateY(-3px);box-shadow:0 0 0 4px #e9bd3f,0 12px 30px #0008}.photo{position:absolute;inset:0;background-image:url('./template.jpg?v=12');background-repeat:no-repeat;background-size:410% auto}.p0 .photo{background-position:31% 0}.p1 .photo{background-position:51% 0}.p2 .photo{background-position:72% 0}.shade{position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(0,0,0,.82) 100%)}.pname{position:absolute;right:14px;left:14px;bottom:12px;font-size:clamp(17px,2vw,28px);font-weight:900;text-shadow:0 2px 5px #000}.pscore{position:absolute;top:10px;left:10px;width:58px;height:58px;border-radius:14px;background:#111d;border:2px solid #ffffff99;display:grid;place-items:center;font-size:32px;font-weight:900}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:20px;box-shadow:0 18px 55px #0009;background:#0a3126}.stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.qnum{position:absolute;top:29.1%;left:43%;width:14%;text-align:center;color:#fff;font-size:clamp(18px,2.2vw,38px);font-weight:900;z-index:4}.content{position:absolute;left:18.2%;right:14.2%;top:39.2%;bottom:18.8%;z-index:5;display:flex;align-items:center;justify-content:center}.editor{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 28px;color:#111;font-size:clamp(28px,3vw,56px);font-weight:800;line-height:1.55;outline:none;overflow:auto;border-radius:18px}.editor:empty:before{content:'اضغطي هنا واكتبي السؤال أو الصقيه';color:#777;font-weight:600}.editor.editing{box-shadow:inset 0 0 0 3px rgba(20,120,85,.28);background:rgba(255,255,255,.12)}.img-wrap{width:100%;height:100%;display:none;align-items:center;justify-content:center}.img-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;background:#fff}.floating{position:fixed;z-index:25;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;background:rgba(4,41,29,.96);border:2px solid #e5bd46;border-radius:20px;padding:8px;box-shadow:0 12px 35px #0009}button,.file-label{border:0;border-radius:14px;padding:11px 15px;font-size:17px;font-weight:900;cursor:pointer;white-space:nowrap}.primary{background:#116fdf;color:#fff}.gold{background:#e5b83d;color:#173021}.ghost,.file-label{background:#0d5a3f;color:#fff;border:1px solid #ffffff35}.file-label input{display:none}.panel{position:fixed;z-index:24;left:50%;bottom:78px;transform:translateX(-50%) translateY(18px);width:min(92vw,860px);background:rgba(7,44,32,.98);border:2px solid #e5bd46;border-radius:24px;padding:14px;box-shadow:0 16px 45px #000b;opacity:0;pointer-events:none;transition:.2s}.panel.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}.panel-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hint{text-align:center;font-size:14px;opacity:.85;margin-top:8px}.overlay{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:40;padding:20px}.overlay.show{display:grid}.modal{width:min(720px,94vw);background:#073b2c;border:4px solid #e9bd3f;border-radius:28px;padding:26px;text-align:center}.goalbox{height:260px;background:linear-gradient(#0d69b2 0 62%,#148547 62%);border-radius:18px;position:relative;overflow:hidden;margin:15px 0}.net{position:absolute;left:15%;right:15%;bottom:18%;height:48%;border:7px solid #fff;border-radius:8px 8px 0 0}.ball{position:absolute;left:calc(50% - 35px);bottom:18px;font-size:70px;transition:1s}.ball.go{transform:translate(170px,-125px) rotate(600deg) scale(.7)}.goalBtn{background:#12a85a;color:#fff}.missBtn{background:#c92335;color:#fff}.winTitle{font-size:clamp(54px,8vw,92px);color:#ffd34f;font-weight:1000}.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.toast{position:fixed;z-index:60;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:#0a5d40;border:2px solid #e5bd46;border-radius:14px;padding:10px 18px;font-weight:900;transition:.25s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-width:850px){.app{padding:6px 6px 90px}.players{gap:7px}.player{min-height:120px;border-radius:16px}.pscore{width:44px;height:44px;font-size:24px}.pname{font-size:14px;bottom:8px;right:8px;left:8px}.stage{border-radius:12px}.floating{width:calc(100% - 14px);justify-content:space-between;gap:6px;padding:7px}.floating button{font-size:15px;padding:10px 12px}.editor{font-size:clamp(21px,4.2vw,39px);padding:12px}}@media(max-width:560px){.header{display:none}.player{min-height:92px}.pname{font-size:11px}.pscore{width:36px;height:36px;font-size:20px}.floating .hide-sm{display:none}.floating button{flex:1}.content{left:16.5%;right:12%;top:38.5%;bottom:17.5%}}</style></head><body><div class="app"><div class="header"><div class="title">⚽ بطولة الرياضيات — أ. سارة بنت مداوي حقوي</div></div><div class="players"><div class="player p0 selected" data-team="0"><div class="photo"></div><div class="shade"></div><div class="pscore" id="s0">٠</div><div class="pname">مجموعة سالم الدوسري</div></div><div class="player p1" data-team="1"><div class="photo"></div><div class="shade"></div><div class="pscore" id="s1">٠</div><div class="pname">مجموعة رونالدو</div></div><div class="player p2" data-team="2"><div class="photo"></div><div class="shade"></div><div class="pscore" id="s2">٠</div><div class="pname">مجموعة مبابي</div></div></div><div class="stage"><img class="stage-bg" src="./template.jpg?v=12" alt="قالب بطولة الرياضيات"><div class="qnum" id="qnum">السؤال ١</div><div class="content"><div id="editor" class="editor" contenteditable="true"></div><div id="imgWrap" class="img-wrap"><img id="qimg" alt="صورة السؤال"></div></div></div></div><div class="panel" id="panel"><div class="panel-row"><button class="ghost" id="textMode">✍️ كتابة / لصق نص</button><label class="file-label">🖼️ إضافة صورة<input id="file" type="file" accept="image/*"></label><button class="ghost" id="pasteImage">📋 لصق صورة</button><button class="ghost" id="smaller">أ−</button><button class="ghost" id="bigger">أ+</button><button class="ghost" id="clear">🧹 مسح السؤال</button></div><div class="hint">اختاري الفريق من صورة اللاعب، ثم أضيفي السؤال داخل المساحة البيضاء.</div></div><div class="floating"><button class="gold" id="editBtn">✏️ إعداد السؤال</button><button class="primary" id="shoot">⚽ سدد</button><button class="ghost hide-sm" id="next">التالي</button><button class="ghost hide-sm" id="reset">إعادة النتائج</button></div><div class="overlay" id="kick"><div class="modal"><h1 id="teamTitle"></h1><div class="goalbox"><div class="net"></div><div class="ball" id="ball">⚽</div></div><div class="modal-actions"><button class="goalBtn" id="goal">🥅 هدف!</button><button class="missBtn" id="miss">✖ ضاعت التسديدة</button></div></div></div><div class="overlay" id="win"><div class="modal"><div style="font-size:36px">🎉✨🏆✨🎉</div><div class="winTitle">هـدف!</div><h1 id="winner"></h1><p>تمت إضافة نقطة للفريق</p><button class="primary" id="continueBtn">السؤال التالي ←</button></div></div><div class="toast" id="toast"></div><script>const names=['مجموعة سالم الدوسري','مجموعة رونالدو','مجموعة مبابي'];let scores=[0,0,0],team=0,q=1,fontScale=1;const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);const el=id=>document.getElementById(id);function toastMsg(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}function render(){scores.forEach((v,i)=>el('s'+i).textContent=ar(v));document.querySelectorAll('.player').forEach((e,i)=>e.classList.toggle('selected',i===team));qnum.textContent='السؤال '+ar(q)}document.querySelectorAll('.player').forEach(e=>e.onclick=()=>{team=+e.dataset.team;render();toastMsg(names[team])});function showText(){imgWrap.style.display='none';editor.style.display='flex';editor.classList.add('editing');editor.focus()}function showImage(src){qimg.src=src;imgWrap.style.display='flex';editor.style.display='none';panel.classList.remove('show')}editBtn.onclick=()=>panel.classList.toggle('show');textMode.onclick=()=>{showText();panel.classList.remove('show')};file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>showImage(r.result);r.readAsDataURL(f)};pasteImage.onclick=async()=>{try{const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){const blob=await item.getType(type);showImage(URL.createObjectURL(blob));return}}toastMsg('لا توجد صورة في الحافظة')}catch(err){toastMsg('استخدمي إضافة صورة من الجهاز')}};bigger.onclick=()=>{fontScale=Math.min(1.7,fontScale+.1);editor.style.transform='scale('+fontScale+')'};smaller.onclick=()=>{fontScale=Math.max(.65,fontScale-.1);editor.style.transform='scale('+fontScale+')'};clear.onclick=()=>{editor.innerHTML='';qimg.removeAttribute('src');showText();fontScale=1;editor.style.transform='scale(1)'};shoot.onclick=()=>{panel.classList.remove('show');editor.classList.remove('editing');teamTitle.textContent=names[team];kick.classList.add('show');ball.classList.remove('go');setTimeout(()=>ball.classList.add('go'),70)};goal.onclick=()=>{scores[team]++;kick.classList.remove('show');winner.textContent='ممتاز! '+names[team];win.classList.add('show');render()};function advance(){q++;team=(team+1)%3;editor.innerHTML='';qimg.removeAttribute('src');imgWrap.style.display='none';editor.style.display='flex';editor.classList.remove('editing');fontScale=1;editor.style.transform='scale(1)';render()}miss.onclick=()=>{kick.classList.remove('show');advance()};continueBtn.onclick=()=>{win.classList.remove('show');advance()};next.onclick=advance;reset.onclick=()=>{if(confirm('هل تريدين إعادة النتائج؟')){scores=[0,0,0];team=0;q=1;editor.innerHTML='';qimg.removeAttribute('src');imgWrap.style.display='none';editor.style.display='flex';render()}};render();</script></body></html>
