<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بطولة نجمات الرياضيات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#4a176f 0,#1b0c31 38%,#090714 100%);color:#fff;min-height:100vh}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.home{background:#ffffff14;border:1px solid #ffffff30;color:#fff;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:800}.title{text-align:center;flex:1}.title h1{margin:0;font-size:clamp(26px,4vw,50px);color:#ffd76a;text-shadow:0 3px 18px #000}.title p{margin:6px 0 0;color:#eadcf8}.teacher{font-weight:800;color:#ffe7a2}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.team{position:relative;border:2px solid #ffffff24;background:linear-gradient(180deg,#ffffff16,#ffffff08);border-radius:22px;padding:14px;text-align:center;cursor:pointer;transition:.2s;min-height:132px;box-shadow:0 10px 28px #0005}.team.active{transform:translateY(-4px);border-color:#ffd65c;box-shadow:0 0 0 3px #ffd65c30,0 14px 34px #0007}.icon{font-size:40px}.team h3{margin:5px 0;font-size:19px}.score{font-size:33px;font-weight:900;color:#ffd65c}.tag{font-size:12px;color:#d8c7ec}.question-wrap{background:linear-gradient(145deg,#fffdf8,#f4ecff);border:5px solid #d4a93f;border-radius:28px;min-height:410px;padding:20px;color:#251337;box-shadow:0 20px 60px #0008;position:relative}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.badge{background:#3b155c;color:#fff;border-radius:999px;padding:8px 14px;font-weight:900}.qnum{font-weight:900;color:#603786}.question-area{min-height:300px;border:3px dashed #b798ca;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.question-area textarea{width:100%;height:300px;border:0;outline:0;resize:none;padding:26px;font:800 clamp(24px,4vw,48px)/1.7 Tahoma,Arial;text-align:center;color:#281039;background:transparent}.question-area img{max-width:100%;max-height:300px;object-fit:contain;display:none}.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;justify-content:center}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:#6b2d91;color:#fff}.gold{background:linear-gradient(#ffdf75,#c98f19);color:#2c1800}.good{background:#168a5b;color:#fff}.bad{background:#ae2b55;color:#fff}.light{background:#eee4f7;color:#38134f}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px}.shot{font-size:21px;padding:14px 28px}.navpair{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap}.navpair .btn{min-width:170px}.cloud{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;background:#4b176d;border:2px solid #eac95b;border-radius:999px;padding:8px 14px;font-weight:900;box-shadow:0 5px 18px #0007}.overlay{position:fixed;inset:0;background:#12071aeF;display:none;align-items:center;justify-content:center;z-index:100;text-align:center;padding:25px}.overlay.show{display:flex}.result{font-size:clamp(35px,8vw,88px);font-weight:900;color:#ffd65c;text-shadow:0 0 30px #e0a52a}.result small{display:block;font-size:.32em;color:#fff;margin-top:15px}.winner{position:fixed;inset:0;background:radial-gradient(circle,#7c349d,#18091f 70%);z-index:120;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}.winner.show{display:flex}.winner h2{font-size:clamp(38px,8vw,90px);margin:0;color:#ffdf73}.winner p{font-size:25px}.winner button{margin-top:20px}@media(max-width:760px){.app{padding:12px}.teams{grid-template-columns:repeat(2,1fr)}.team{min-height:115px}.question-wrap{min-height:350px;padding:12px}.question-area{min-height:250px}.question-area textarea{height:250px}.top{align-items:flex-start}.teacher{display:none}.navpair{width:100%}.navpair .btn{min-width:0;flex:1}}
</style></head>
<body>
<div class="cloud" id="cloud">☁️ جارٍ الاتصال...</div>
<div class="app">
<div class="top"><a class="home" href="/">⌂ الرئيسية</a><div class="title"><h1>👑 بطولة نجمات الرياضيات</h1><p>أربع فرق • سؤال واحد في كل جولة • الفريق الأعلى نقاطًا يتوّج بالبطولة</p></div><div class="teacher">أ. سارة حقوي</div></div>
<div class="teams" id="teams"></div>
<div class="question-wrap">
 <div class="qhead"><span class="badge" id="teamBadge">اختاري الفريق</span><span class="qnum" id="qnum">السؤال ١</span></div>
 <div class="question-area"><textarea id="qtext" placeholder="اكتبي أو الصقي السؤال هنا..."></textarea><img id="qimg" alt="صورة السؤال"></div>
 <div class="tools"><button class="btn primary" id="imgBtn">🖼️ إضافة صورة سؤال</button><button class="btn light" id="textBtn">✍️ كتابة سؤال</button><button class="btn light" id="removeImg">حذف الصورة</button><input id="file" type="file" accept="image/*" hidden></div>
</div>
<div class="controls"><button class="btn good shot" id="winBtn">✨ إجابة صحيحة + نقطة</button><button class="btn bad shot" id="loseBtn">✖ إجابة غير صحيحة</button><div class="navpair"><button class="btn light shot" id="prevBtn">→ السؤال السابق</button><button class="btn gold shot" id="nextBtn">السؤال التالي ←</button></div><button class="btn light" id="champBtn">🏆 إعلان الفائز</button><button class="btn light" id="resetBtn">إعادة النتائج</button></div>
</div>
<div class="overlay" id="overlay"><div class="result" id="result"></div></div>
<div class="winner" id="winner"><div><div style="font-size:80px">🏆👑✨</div><h2 id="winnerName"></h2><p>بطلات الرياضيات لهذا التحدي</p><button class="btn gold" onclick="document.getElementById('winner').classList.remove('show')">العودة للمسابقة</button></div></div>
<script>
const STORE='girlsMathQuiz_v1';
const names=['فريق الألماس','فريق الملكات','فريق النجمات','فريق الإبداع'];
const icons=['💎','👑','⭐','🦋'];
let state={scores:[0,0,0,0],active:0,q:1,questions:{}};
try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}
const teams=document.getElementById('teams'),qtext=document.getElementById('qtext'),qimg=document.getElementById('qimg'),file=document.getElementById('file');
function ar(n){return String(n).replace(/0/g,'٠').replace(/1/g,'١').replace(/2/g,'٢').replace(/3/g,'٣').replace(/4/g,'٤').replace(/5/g,'٥').replace(/6/g,'٦').replace(/7/g,'٧').replace(/8/g,'٨').replace(/9/g,'٩')}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function ensure(){if(!state.questions[state.q])state.questions[state.q]={text:'',image:''};return state.questions[state.q]}
function renderTeams(){teams.innerHTML='';names.forEach((n,i)=>{const d=document.createElement('div');d.className='team'+(state.active===i?' active':'');d.innerHTML=`<div class="icon">${icons[i]}</div><h3>${n}</h3><div class="score">${ar(state.scores[i]||0)}</div><div class="tag">اضغطي لاختيار الفريق</div>`;d.onclick=()=>{state.active=i;save();render()};teams.appendChild(d)})}
function render(){renderTeams();document.getElementById('teamBadge').textContent=icons[state.active]+' '+names[state.active];document.getElementById('qnum').textContent='السؤال '+ar(state.q);document.getElementById('prevBtn').disabled=state.q<=1;const x=ensure();qtext.value=x.text||'';if(x.image){qimg.src=x.image;qimg.style.display='block';qtext.style.display='none'}else{qimg.style.display='none';qtext.style.display='block'}save()}
qtext.addEventListener('input',()=>{ensure().text=qtext.value;save()});
document.getElementById('imgBtn').onclick=()=>file.click();document.getElementById('textBtn').onclick=()=>{qimg.style.display='none';qtext.style.display='block';qtext.focus()};
document.getElementById('removeImg').onclick=()=>{ensure().image='';qimg.removeAttribute('src');qimg.style.display='none';qtext.style.display='block';save()};
file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ensure().image=r.result;qimg.src=r.result;qimg.style.display='block';qtext.style.display='none';save()};r.readAsDataURL(f)};
function audio(ok){const A=window.AudioContext||window.webkitAudioContext;const c=new A();const now=c.currentTime;const seq=ok?[523,659,784,1046]:[320,250,190];seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type=ok?'triangle':'sawtooth';g.gain.setValueAtTime(.001,now+i*.13);g.gain.exponentialRampToValueAtTime(.18,now+i*.13+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.13+.16);o.connect(g);g.connect(c.destination);o.start(now+i*.13);o.stop(now+i*.13+.18)})}
function flash(ok){audio(ok);const ov=document.getElementById('overlay'),r=document.getElementById('result');r.innerHTML=ok?'✨ أحسنتم!<small>'+names[state.active]+' حصل على نقطة</small>':'المحاولة القادمة أفضل 🌷<small>'+names[state.active]+'</small>';ov.classList.add('show');setTimeout(()=>ov.classList.remove('show'),1200)}
document.getElementById('winBtn').onclick=()=>{state.scores[state.active]=(state.scores[state.active]||0)+1;save();renderTeams();flash(true)};
document.getElementById('loseBtn').onclick=()=>flash(false);
document.getElementById('prevBtn').onclick=()=>{if(state.q>1){state.q--;save();render()}};
document.getElementById('nextBtn').onclick=()=>{state.q++;state.active=(state.active+1)%4;save();render()};
document.getElementById('champBtn').onclick=()=>{const m=Math.max(...state.scores),idx=state.scores.indexOf(m);document.getElementById('winnerName').textContent=icons[idx]+' '+names[idx];document.getElementById('winner').classList.add('show');audio(true)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('إعادة نقاط الفرق إلى صفر؟')){state.scores=[0,0,0,0];save();renderTeams()}};
render();
</script></body></html>
