<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بطولة نجمات الرياضيات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#4a176f 0,#1b0c31 38%,#090714 100%);color:#fff;min-height:100vh}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.home,.back{background:#ffffff14;border:1px solid #ffffff30;color:#fff;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:800;cursor:pointer}.title{text-align:center;flex:1}.title h1{margin:0;font-size:clamp(26px,4vw,50px);color:#ffd76a;text-shadow:0 3px 18px #000}.title p{margin:6px 0 0;color:#eadcf8}.teacher{font-weight:800;color:#ffe7a2}.menuTitle{text-align:center;margin:20px 0 14px;font-size:26px;color:#ffe59a}.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.gradeBtn{border:2px solid #ffffff25;border-radius:26px;padding:34px 18px;background:linear-gradient(145deg,#71379a,#351249);color:#fff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 18px 45px #0006}.gradeBtn span{display:block;font-size:48px;margin-bottom:8px}.gradeBtn:active{transform:scale(.98)}.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.chapter{background:linear-gradient(145deg,#ffffff15,#ffffff08);border:2px solid #ffffff22;border-radius:24px;padding:16px;box-shadow:0 16px 34px #0005}.chapter h2{margin:0 0 12px;color:#ffd76a;font-size:22px}.activityBtns{display:grid;gap:9px}.activityBtn{border:0;border-radius:15px;padding:13px 12px;font-weight:900;font-size:16px;cursor:pointer;text-align:right;background:#f6eefc;color:#3c1451}.activityBtn:nth-child(2){background:#7f3ca1;color:#fff}.activityBtn:nth-child(3){background:linear-gradient(#ffdf75,#d5a329);color:#341d00}.hidden{display:none!important}.competition{display:none}.competition.show{display:block}.activityBar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.activityName{flex:1;text-align:center;font-size:20px;font-weight:900;color:#ffe59a}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.team{border:2px solid #ffffff24;background:linear-gradient(180deg,#ffffff16,#ffffff08);border-radius:22px;padding:14px;text-align:center;cursor:pointer;transition:.2s;min-height:132px;box-shadow:0 10px 28px #0005}.team.active{transform:translateY(-4px);border-color:#ffd65c;box-shadow:0 0 0 3px #ffd65c30,0 14px 34px #0007}.icon{font-size:40px}.team h3{margin:5px 0;font-size:19px}.score{font-size:33px;font-weight:900;color:#ffd65c}.tag{font-size:12px;color:#d8c7ec}.question-wrap{background:linear-gradient(145deg,#fffdf8,#f4ecff);border:5px solid #d4a93f;border-radius:28px;min-height:410px;padding:20px;color:#251337;box-shadow:0 20px 60px #0008}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.badge{background:#3b155c;color:#fff;border-radius:999px;padding:8px 14px;font-weight:900}.qnum{font-weight:900;color:#603786}.question-area{min-height:300px;border:3px dashed #b798ca;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.question-area textarea{width:100%;height:300px;border:0;outline:0;resize:none;padding:26px;font:800 clamp(24px,4vw,48px)/1.7 Tahoma,Arial;text-align:center;color:#281039;background:transparent}.question-area img{max-width:100%;max-height:300px;object-fit:contain;display:none}.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;justify-content:center}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:#6b2d91;color:#fff}.gold{background:linear-gradient(#ffdf75,#c98f19);color:#2c1800}.good{background:#168a5b;color:#fff}.bad{background:#ae2b55;color:#fff}.light{background:#eee4f7;color:#38134f}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px}.shot{font-size:21px;padding:14px 28px}.navpair{display:flex;gap:10px;justify-content:center}.navpair .btn{min-width:170px}.overlay{position:fixed;inset:0;background:#12071aef;display:none;align-items:center;justify-content:center;z-index:100;text-align:center;padding:25px}.overlay.show{display:flex}.result{font-size:clamp(35px,8vw,88px);font-weight:900;color:#ffd65c}.result small{display:block;font-size:.32em;color:#fff;margin-top:15px}.winner{position:fixed;inset:0;background:radial-gradient(circle,#7c349d,#18091f 70%);z-index:120;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}.winner.show{display:flex}.winner h2{font-size:clamp(38px,8vw,90px);margin:0;color:#ffdf73}.winner p{font-size:25px}@media(max-width:760px){.app{padding:12px}.grades,.chapters{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,1fr)}.team{min-height:115px}.question-wrap{min-height:350px;padding:12px}.question-area{min-height:250px}.question-area textarea{height:250px}.teacher{display:none}.navpair{width:100%}.navpair .btn{min-width:0;flex:1}.activityBar{align-items:stretch;flex-direction:column}.back{width:100%}}
</style></head>
<body>

<div class="app">
<div class="top"><a class="home" href="/">⌂ الرئيسية</a><div class="title"><h1>👑 بطولة نجمات الرياضيات</h1><p id="subtitle">اختاري الصف ثم الباب ونوع التحدي</p></div><div class="teacher">أ. سارة حقوي</div></div>
<section id="gradeMenu"><div class="menuTitle">🎓 اختاري الصف</div><div class="grades"><button class="gradeBtn" data-grade="6"><span>🌟</span>سادس ابتدائي</button><button class="gradeBtn" data-grade="7"><span>💜</span>أول متوسط</button><button class="gradeBtn" data-grade="8"><span>👑</span>ثاني متوسط</button></div></section>
<section id="chapterMenu" class="hidden"><div class="activityBar"><button class="back" id="backGrades">↩ اختيار الصف</button><div class="activityName" id="gradeName"></div></div><div class="menuTitle">📚 أبواب الرياضيات</div><div class="chapters" id="chapters"></div></section>
<section class="competition" id="competition"><div class="activityBar"><button class="back" id="backChapters">↩ قائمة الأبواب</button><div class="activityName" id="activityName"></div></div><div class="teams" id="teams"></div><div class="question-wrap"><div class="qhead"><span class="badge" id="teamBadge">اختاري الفريق</span><span class="qnum" id="qnum">السؤال ١</span></div><div class="question-area"><textarea id="qtext" placeholder="اكتبي أو الصقي السؤال هنا..."></textarea><img id="qimg" alt="صورة السؤال"></div><div class="tools"><button class="btn primary" id="imgBtn">🖼️ إضافة صورة سؤال</button><button class="btn light" id="textBtn">✍️ كتابة سؤال</button><button class="btn light" id="removeImg">حذف الصورة</button><input id="file" type="file" accept="image/*" hidden></div></div><div class="controls"><button class="btn good shot" id="winBtn">✨ إجابة صحيحة + نقطة</button><button class="btn bad shot" id="loseBtn">✖ إجابة غير صحيحة</button><div class="navpair"><button class="btn light shot" id="prevBtn">→ السؤال السابق</button><button class="btn gold shot" id="nextBtn">السؤال التالي ←</button></div><button class="btn light" id="champBtn">🏆 إعلان الفائز</button><button class="btn light" id="resetBtn">إعادة النتائج</button></div></section>
</div>
<div class="overlay" id="overlay"><div class="result" id="result"></div></div><div class="winner" id="winner"><div><div style="font-size:80px">🏆👑✨</div><h2 id="winnerName"></h2><p>بطلات الرياضيات لهذا التحدي</p><button class="btn gold" onclick="document.getElementById('winner').classList.remove('show')">العودة للمسابقة</button></div></div>
<script>
const STORE='girlsMathQuiz_v1',names=['فريق الألماس','فريق الملكات','فريق النجمات','فريق الإبداع'],icons=['💎','👑','⭐','🦋'],labels=['اسم الدرس','اختبار منتصف الفصل','الاختبار التراكمي'],gradeLabels={6:'سادس ابتدائي',7:'أول متوسط',8:'ثاني متوسط'};
let root={version:3,currentGrade:null,currentActivity:null,activities:{}};
try{const old=JSON.parse(localStorage.getItem(STORE)||'{}');if(old&&old.version===3&&old.activities)root={...root,...old};else if(old&&old.version===2&&old.activities){Object.entries(old.activities).forEach(([k,v])=>root.activities['g6-'+k]=v)}else if(old&&(old.questions||old.scores)){root.activities['g6-b1-lesson']={scores:old.scores||[0,0,0,0],active:old.active||0,q:old.q||1,questions:old.questions||{}}}}catch{}
const gradeMenu=document.getElementById('gradeMenu'),chapterMenu=document.getElementById('chapterMenu'),competition=document.getElementById('competition'),chapters=document.getElementById('chapters'),teams=document.getElementById('teams'),qtext=document.getElementById('qtext'),qimg=document.getElementById('qimg'),file=document.getElementById('file');
function ar(n){return String(n).replace(/0/g,'٠').replace(/1/g,'١').replace(/2/g,'٢').replace(/3/g,'٣').replace(/4/g,'٤').replace(/5/g,'٥').replace(/6/g,'٦').replace(/7/g,'٧').replace(/8/g,'٨').replace(/9/g,'٩')}
function save(){localStorage.setItem(STORE,JSON.stringify(root))}function blank(){return{scores:[0,0,0,0],active:0,q:1,questions:{}}}function current(){if(!root.currentActivity)return null;if(!root.activities[root.currentActivity])root.activities[root.currentActivity]=blank();return root.activities[root.currentActivity]}
function activityId(g,b,t){return'g'+g+'-b'+b+'-'+['lesson','mid','cumulative'][t]}function activityTitle(g,b,t){return gradeLabels[g]+' • '+labels[t]+' – الباب '+ar(b)}
function showGrades(){root.currentGrade=null;root.currentActivity=null;save();competition.classList.remove('show');chapterMenu.classList.add('hidden');gradeMenu.classList.remove('hidden');document.getElementById('subtitle').textContent='اختاري الصف ثم الباب ونوع التحدي'}
function selectGrade(g){root.currentGrade=+g;root.currentActivity=null;save();gradeMenu.classList.add('hidden');competition.classList.remove('show');chapterMenu.classList.remove('hidden');document.getElementById('gradeName').textContent='🎓 '+gradeLabels[root.currentGrade];document.getElementById('subtitle').textContent=gradeLabels[root.currentGrade]+' • اختاري الباب';buildChapters();window.scrollTo({top:0,behavior:'smooth'})}
function buildChapters(){chapters.innerHTML='';for(let b=1;b<=11;b++){const card=document.createElement('div');card.className='chapter';card.innerHTML='<h2>📘 الباب '+ar(b)+'</h2><div class="activityBtns"></div>';const box=card.querySelector('.activityBtns');labels.forEach((lab,t)=>{const btn=document.createElement('button');btn.className='activityBtn';btn.textContent=(t===0?'✏️ ':t===1?'📝 ':'🏆 ')+lab+' – الباب '+ar(b);btn.onclick=()=>openActivity(b,t);box.appendChild(btn)});chapters.appendChild(card)}}
function openActivity(b,t){const g=root.currentGrade;root.currentActivity=activityId(g,b,t);if(!root.activities[root.currentActivity])root.activities[root.currentActivity]=blank();document.getElementById('activityName').textContent=activityTitle(g,b,t);chapterMenu.classList.add('hidden');competition.classList.add('show');document.getElementById('subtitle').textContent=gradeLabels[g];save();render();window.scrollTo({top:0,behavior:'smooth'})}
function backChapters(){root.currentActivity=null;save();competition.classList.remove('show');chapterMenu.classList.remove('hidden');document.getElementById('subtitle').textContent=gradeLabels[root.currentGrade]+' • اختاري الباب';window.scrollTo({top:0,behavior:'smooth'})}
function ensure(){const s=current();if(!s.questions[s.q])s.questions[s.q]={text:'',image:''};return s.questions[s.q]}function renderTeams(){const s=current();teams.innerHTML='';names.forEach((n,i)=>{const d=document.createElement('div');d.className='team'+(s.active===i?' active':'');d.innerHTML=`<div class="icon">${icons[i]}</div><h3>${n}</h3><div class="score">${ar(s.scores[i]||0)}</div><div class="tag">اضغطي لاختيار الفريق</div>`;d.onclick=()=>{s.active=i;save();render()};teams.appendChild(d)})}
function render(){const s=current();if(!s)return;renderTeams();teamBadge.textContent=icons[s.active]+' '+names[s.active];qnum.textContent='السؤال '+ar(s.q);prevBtn.disabled=s.q<=1;const x=ensure();qtext.value=x.text||'';if(x.image){qimg.src=x.image;qimg.style.display='block';qtext.style.display='none'}else{qimg.style.display='none';qtext.style.display='block'}save()}
document.querySelectorAll('.gradeBtn').forEach(b=>b.onclick=()=>selectGrade(b.dataset.grade));backGrades.onclick=showGrades;backChapters.onclick=backChapters;qtext.addEventListener('input',()=>{if(current()){ensure().text=qtext.value;save()}});imgBtn.onclick=()=>file.click();textBtn.onclick=()=>{qimg.style.display='none';qtext.style.display='block';qtext.focus()};removeImg.onclick=()=>{ensure().image='';qimg.removeAttribute('src');qimg.style.display='none';qtext.style.display='block';save()};file.onchange=()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ensure().image=r.result;qimg.src=r.result;qimg.style.display='block';qtext.style.display='none';save()};r.readAsDataURL(f)};
function audio(ok){const A=window.AudioContext||window.webkitAudioContext,c=new A(),now=c.currentTime,seq=ok?[523,659,784,1046]:[320,250,190];seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type=ok?'triangle':'sawtooth';g.gain.setValueAtTime(.001,now+i*.13);g.gain.exponentialRampToValueAtTime(.18,now+i*.13+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.13+.16);o.connect(g);g.connect(c.destination);o.start(now+i*.13);o.stop(now+i*.13+.18)})}function flash(ok){const s=current();audio(ok);result.innerHTML=ok?'✨ أحسنتم!<small>'+names[s.active]+' حصل على نقطة</small>':'المحاولة القادمة أفضل 🌷<small>'+names[s.active]+'</small>';overlay.classList.add('show');setTimeout(()=>overlay.classList.remove('show'),1200)}
winBtn.onclick=()=>{const s=current();s.scores[s.active]=(s.scores[s.active]||0)+1;save();renderTeams();flash(true)};loseBtn.onclick=()=>flash(false);prevBtn.onclick=()=>{const s=current();if(s.q>1){s.q--;save();render()}};nextBtn.onclick=()=>{const s=current();s.q++;s.active=(s.active+1)%4;save();render()};champBtn.onclick=()=>{const s=current(),m=Math.max(...s.scores),idx=s.scores.indexOf(m);winnerName.textContent=icons[idx]+' '+names[idx];winner.classList.add('show');audio(true)};resetBtn.onclick=()=>{if(confirm('إعادة نقاط الفرق إلى صفر؟')){const s=current();s.scores=[0,0,0,0];save();renderTeams()}};
showGrades();
</script></body></html>
