</style></head><body><div id="hud"><div class="pill" id="score">⭐ ٠</div><div class="pill" id="stage">المرحلة ١ / ١٠</div><div class="pill" id="world">العالم ١</div><div class="pill">🏰 مغامرة أبطال الكسور</div></div><div id="hint">🎯 تحركي إلى أي منصة مرقّمة ثم اقفزي عليها لفتح السؤال.</div><div id="joy"><div id="nub"></div></div><button id="jump">⬆️ قفز</button><div class="footer">الصف السادس الابتدائي | المعلمة سارة حقوي</div><div id="overlay"><div class="panel" id="panel"><h1>🌈 مغامرة أبطال الكسور</h1><p>٥ عوالم تعليمية • ١٠ مراحل في كل عالم<br>اختاري منصة من ١ إلى ١٠ واقفزي عليها للإجابة. بعد النجاح ستنتقلين تلقائيًا إلى مسار جديد!</p><button class="mainbtn" id="start">ابدئي المغامرة ▶</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const $=x=>document.getElementById(x),arab=x=>String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);let world=0,stage=0,score=0,started=false,locked=false,selected=-1,vy=0,ground=true,delay=0,transition=0,fromZ=0,toZ=0,joyX=0,joyY=0;const keys={},names=['الأعداد الكسرية والكسور غير الفعلية','تبسيط الكسور الاعتيادية','مقارنة الكسور الاعتيادية','تحويل الأعداد العشرية إلى كسور اعتيادية','تحويل الكسور الاعتيادية إلى أعداد عشرية'];const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ee8ff);scene.fog=new THREE.Fog(0x8ee8ff,65,170);const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,260);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x7e91c7,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-12,22,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;scene.add(sun);const env=new THREE.Group();scene.add(env);const avatar=new THREE.Group();scene.add(avatar);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.55});function box(w,h,d,c,x,y,z,g=env){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}function sphere(r,c,x,y,z,g=env){let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}box(.85,1.1,.55,0xef617f,0,1.05,0,avatar);box(.25,.85,.25,0xf6c6a0,-.58,1.05,0,avatar);box(.25,.85,.25,0xf6c6a0,.58,1.05,0,avatar);box(.3,.8,.34,0x3549aa,-.25,.12,0,avatar);box(.3,.8,.34,0x3549aa,.25,.12,0,avatar);sphere(.44,0xf6c6a0,0,1.85,0,avatar);sphere(.47,0x503a70,0,2.13,.10,avatar);let tiles=[];const colors=[0xffd760,0x7ae5fa,0xfca3d6,0x9ded98,0xb5a0ff,0xffa879];function keycap(x,z,y,color,n,w=3.2,d=2.85){box(w,.36,d,0x6556a2,x,y-.55,z);let cap=box(w-.15,.5,d-.15,color,x,y-.13,z);box(w-.36,.055,d-.34,0xffffff,x,y+.15,z).material.transparent=true;let cv=document.createElement('canvas');cv.width=256;cv.height=256;let ctx=cv.getContext('2d');ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 158px Arial';ctx.fillStyle='#423578';ctx.fillText(arab(n),128,136);let texture=new THREE.CanvasTexture(cv);texture.encoding=THREE.sRGBEncoding;let label=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.9),new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false}));label.rotation.x=-Math.PI/2;label.position.set(x,y+.20,z);env.add(label);tiles.push({x,z,y,n,cap});}
function cloud(x,y,z){for(let k=0;k<5;k++)sphere(1.5+(k%2)*.45,0xffffff,x+(k-2)*1.15,y+Math.sin(k*2)*.3,z)}function path(){while(env.children.length)env.remove(env.children[0]);tiles=[];selected=-1;delay=.8;let variant=stage%5,dir=stage%2===0?1:-1;scene.background.setHex(variant===1?0x75ddff:0x93eaff);scene.fog.color.copy(scene.background);for(let k=0;k<18;k++)cloud((k%2?-1:1)*(12+k%5*5),-4+(k%3)*2,-k*9);for(let j=0;j<10;j++){let x=0,z=0,y=0;let progress=j;switch(variant){case 0:x=(j%5-2)*3.5;z=4-Math.floor(j/5)*4.1;break;case 1:x=(j%2?1.8:-1.8);z=5-j*3.1;y=j*.24;break;case 2:x=Math.sin(j*.9)*4.2;z=5-j*3.2;break;case 3:x=(j%3-1)*3.5;z=5-Math.floor(j/3)*3.7;y=Math.floor(j/3)*.43;break;case 4:x=(j%2?2.4:-2.4);z=5-Math.floor(j/2)*4.2;y=(j%2)*.2;break;}if(dir<0)z=-14-z;keycap(x,z,y,colors[(j+stage)%colors.length],j+1)}for(let k=0;k<9;k++){let z=8-k*4.8;for(let side of [-1,1]){let x=side*12;box(.7,3,.7,0xa8744c,x,-.2,z);sphere(2.2,0x61db8c,x,2.2,z);sphere(1.4,0x8af1a1,x-1,3,z)}}box(8,.8,2,0xffdb6b,0,-.6,-33);box(2,5,2,0xf49fc4,-3,1.4,-34);box(2,5,2,0x9b8afa,3,1.4,-34);box(8,.8,2,0xf6e1ff,0,4.1,-34);for(let k=0;k<7;k++)sphere(.32,0xfff0a1,-3+k,4.7,-34);avatar.position.set(0,0,dir>0?10:-26);avatar.rotation.y=dir>0?0:Math.PI;vy=0;ground=true;$('stage').textContent='المرحلة '+arab(stage+1)+' / ١٠';$('world').textContent='🌍 العالم '+arab(world+1);$('score').textContent='⭐ '+arab(score);$('hint').textContent=['⌨️ لوحة مفاتيح ملونة: اختاري رقمًا واقفزي','☁️ درج فوق الغيوم: اصعدي واختاري رقمًا','🌈 مسار متعرج: اتبعي المنصات الملونة','🏰 منصات متدرجة: اختاري منصة مرتفعة','🌉 جسران ملونان: اختاري رقمًا'][variant];}
function gcd(a,b){return b?gcd(b,a%b):a}function frac(a,b){return '<span class="frac"><b>'+arab(a)+'</b><b>'+arab(b)+'</b></span>'}function mixed(n,a,b){return '<span class="mixed">'+arab(n)+' '+frac(a,b)+'</span>'}function question(){let j=selected<0?0:tiles[selected].n,seed=(stage+world*10+j)%8+2,a=seed,b=seed+3,opts=[],correct=0,q='';if(world===0){let n=1+seed%3,num=b*n+a;q='حوّلي العدد الكسري '+mixed(n,a,b)+' إلى كسر غير فعلي';correct=num+'/'+b;opts=[correct,(num+1)+'/'+b,(num-b)+'/'+b,num+'/'+(b+1)];}else if(world===1){let k=2+seed%4;q='بسّطي الكسر '+frac(a*k,b*k);correct=a+'/'+b;opts=[correct,(a+1)+'/'+b,a+'/'+(b+1),(a*k)+'/'+b];}else if(world===2){let c=a+1;q='قارني بين '+frac(a,b)+' و '+frac(c,b);correct='أصغر من';opts=['أصغر من','أكبر من','يساوي','لا يمكن المقارنة'];}else if(world===3){let digit=seed%9+1;q='اكتبي العدد العشري '+arab('0.'+digit)+' على صورة كسر اعتيادي';correct=digit+'/10';opts=[correct,digit+'/100','10/'+digit,(digit+1)+'/10'];}else{let digit=seed%9+1;q='اكتبي الكسر '+frac(digit,10)+' على صورة عدد عشري';correct='0.'+digit;opts=[correct,'0.0'+digit,'1.'+digit,'0.'+((digit+1)%10)];}opts=[...new Set(opts)];while(opts.length<4)opts.push('1/'+(opts.length+10));opts.sort((x,y)=>((x.length*7+seed*3)%11)-((y.length*5+seed)%11));return{q,correct,opts};}
function showFraction(v){if(v.includes('/')){let p=v.split('/');return frac(p[0],p[1])}return arab(v)}function openQuestion(){if(locked||!started)return;locked=true;let q=question();$('overlay').classList.remove('hide');$('panel').innerHTML='<h1>🧠 تحدي الكسور</h1><p>العالم: '+names[world]+'</p><h2>'+q.q+'</h2><div id="answers"></div><div id="feedback"></div>';q.opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.innerHTML=showFraction(o);b.onclick=()=>{if(o!==q.correct){$('feedback').textContent='💜 حاولي مرة أخرى';return}score+=100;$('feedback').textContent='🌟 إجابة صحيحة!';[...$('answers').children].forEach(e=>e.disabled=true);setTimeout(()=>{if(stage===9&&world===4){$('panel').innerHTML='<h1>🏆 بطلة الكسور!</h1><p>أنهيتِ جميع العوالم والمراحل بنجاح</p><h2>⭐ '+arab(score)+' نقطة</h2><button class="mainbtn" onclick="location.reload()">العبِي من جديد</button>';started=false;return} $('overlay').classList.add('hide');transition=1;fromZ=avatar.position.z;toZ=stage%2===0?-26:10;locked=true},600)};$('answers').appendChild(b)});}
function jump(){if(!started||locked||!ground)return;let i=tiles.findIndex(t=>Math.abs(avatar.position.x-t.x)<1.58&&Math.abs(avatar.position.z-t.z)<1.4);vy=.19;ground=false;if(i>=0&&delay<=0){selected=i;setTimeout(openQuestion,280)}}$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});let joy=$('joy'),nub=$('nub');function moveJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),f=Math.min(1,49/Math.max(1,l));joyX=x*f/49;joyY=y*f/49;nub.style.transform='translate('+x*f+'px,'+y*f+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')moveJoy(e)});function stop(){joyX=joyY=0;nub.style.transform='translate(0,0)'}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.code]=false);let audio;function music(){try{audio=new(window.AudioContext||window.webkitAudioContext)();let notes=[261.6,329.6,392,523.2,392,329.6,293.7,349.2];let t=0;function loop(){if(!started||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=notes[t++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.018,audio.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.24);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25);setTimeout(loop,350)}loop()}catch(e){}}$('start').onclick=()=>{started=true;$('overlay').classList.add('hide');path();music()};let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(.045,clock.getDelta()),f=dt*60;delay=Math.max(0,delay-dt);let dir=stage%2===0?1:-1;if(transition){transition+=dt/1.5;let k=Math.min(1,transition-1),ease=k*k*(3-2*k);avatar.position.z=fromZ+(t
