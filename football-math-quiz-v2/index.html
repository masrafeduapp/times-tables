<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطولة الرياضيات</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07539a 0 28%,#075b32 28%);font-family:Tahoma,Arial;color:#fff;padding:12px 12px 95px}.app{max-width:1500px;margin:auto}.title{text-align:center;background:#063d2b;border:3px solid #e8bd45;border-radius:22px;padding:10px;font-size:34px;font-weight:900;color:#ffd95b}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.player{height:180px;border-radius:22px;overflow:hidden;position:relative;border:4px solid transparent;cursor:pointer;box-shadow:0 10px 24px #0008}.player.sel{border-color:#fff;box-shadow:0 0 0 4px #e8bd45}.player img{width:100%;height:100%;object-fit:cover;object-position:center top}.player:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}.name{position:absolute;z-index:2;bottom:10px;right:8px;left:8px;text-align:center;font-size:24px;font-weight:900}.score{position:absolute;z-index:3;top:10px;left:10px;width:60px;height:60px;display:grid;place-items:center;background:#111e;border:2px solid #fff;border-radius:14px;font-size:34px;font-weight:900}.arena{background:#0b6b40;border:4px solid #e8bd45;border-radius:25px;padding:14px}.qnum{width:max-content;margin:auto auto 10px;background:#063d2b;border:3px solid #e8bd45;border-radius:999px;padding:9px 28px;font-size:30px;font-weight:900}.board{background:#fff;color:#111;border:8px solid #0b5a3b;border-radius:28px;height:66vh;min-height:560px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 3px #e1bf59}.editor{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:36px;font-size:56px;font-weight:900;line-height:1.5;outline:none}.editor:empty:before{content:'اكتبي السؤال هنا أو الصقي النص';color:#999}.imgwrap{display:none;width:100%;height:100%;align-items:center;justify-content:center;padding:20px}.imgwrap img{max-width:100%;max-height:100%;object-fit:contain}.toolbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;background:#063d2bf2;border:2px solid #e8bd45;border-radius:18px;padding:8px;z-index:20}.toolbar button,.toolbar label{border:0;border-radius:12px;padding:11px 15px;font-size:16px;font-weight:900;cursor:pointer}.toolbar input{display:none}.gold{background:#e4b83f}.blue{background:#1478e8;color:#fff}.green{background:#0d6746;color:#fff}.overlay{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:50}.overlay.show{display:grid}.modal{width:min(700px,94vw);background:#063d2b;border:4px solid #e8bd45;border-radius:24px;padding:24px;text-align:center}.goalbox{height:260px;background:linear-gradient(#1680c4 0 62%,#15934f 62%);border-radius:18px;position:relative}.net{position:absolute;left:15%;right:15%;bottom:17%;height:48%;border:8px solid #fff}.ball{position:absolute;left:48%;bottom:15px;font-size:70px;transition:1s}.ball.go{transform:translate(180px,-130px) rotate(600deg)}.actions{display:flex;gap:10px;justify-content:center;margin-top:15px}.actions button{border:0;border-radius:12px;padding:12px 22px;font-size:20px;font-weight:900}.goal{background:#13a75a;color:#fff}.miss{background:#c82a3c;color:#fff}.win{font-size:80px;color:#ffd34f;font-weight:1000}@media(max-width:900px){.player{height:140px}.name{font-size:15px}.score{width:46px;height:46px;font-size:24px}.board{height:68vh;min-height:520px}.editor{font-size:42px}.toolbar{width:calc(100% - 14px);justify-content:space-between}.toolbar button,.toolbar label{font-size:14px;padding:10px 11px}}@media(max-width:560px){.player{height:105px}.name{font-size:11px}.score{width:38px;height:38px;font-size:20px}.board{min-height:430px}.editor{font-size:28px}.hide{display:none}}</style><body><div class="app"><div class="title">⚽ بطولة الرياضيات — أ. سارة بنت مداوي حقوي</div><div class="players"><div class="player sel" data-team="0"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Salem_Al-Dawsari.jpg?width=700"><div class="score" id="s0">٠</div><div class="name">مجموعة سالم الدوسري</div></div><div class="player" data-team="1"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/CR7Portugal24.jpg?width=700"><div class="score" id="s1">٠</div><div class="name">مجموعة رونالدو</div></div><div class="player" data-team="2"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Kylian_Mbapp%C3%A9_%28cropped%29.jpg?width=700"><div class="score" id="s2">٠</div><div class="name">مجموعة مبابي</div></div></div><div class="arena"><div class="qnum" id="qnum">السؤال ١</div><div class="board"><div id="editor" class="editor" contenteditable="true"></div><div id="imgwrap" class="imgwrap"><img id="qimg"></div></div></div></div><div class="toolbar"><button class="gold" id="textBtn">✍️ كتابة</button><label class="green">🖼️ صورة<input id="file" type="file" accept="image/*"></label><button class="blue" id="shoot">⚽ سدد</button><button class="green hide" id="next">التالي</button><button class="green hide" id="reset">إعادة النتائج</button></div><div class="overlay" id="kick"><div class="modal"><h1 id="teamTitle"></h1><div class="goalbox"><div class="net"></div><div class="ball" id="ball">⚽</div></div><div class="actions"><button class="goal" id="goal">🥅 هدف!</button><button class="miss" id="miss">✖ ضاعت</button></div></div></div><div class="overlay" id="win"><div class="modal"><div class="win">هـدف!</div><h1 id="winner"></h1><button class="blue" id="cont">التالي ←</button></div></div><script>const names=['مجموعة سالم الدوسري','مجموعة رونالدو','مجموعة مبابي'];let scores=[0,0,0],team=0,q=1;const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function render(){scores.forEach((v,i)=>document.getElementById('s'+i).textContent=ar(v));document.querySelectorAll('.player').forEach((p,i)=>p.classList.toggle('sel',i===team));qnum.textContent='السؤال '+ar(q)}document.querySelectorAll('.player').forEach(p=>p.onclick=()=>{team=+p.dataset.team;render()});textBtn.onclick=()=>{imgwrap.style.display='none';editor.style.display='flex';editor.focus()};file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{qimg.src=r.result;imgwrap.style.display='flex';editor.style.display='none'};r.readAsDataURL(f)};shoot.onclick=()=>{teamTitle.textContent=names[team];kick.classList.add('show');ball.classList.remove('go');setTimeout(()=>ball.classList.add('go'),60)};goal.onclick=()=>{scores[team]++;kick.classList.remove('show');winner.textContent='ممتاز! '+names[team];win.classList.add('show');render()};function adv(){q++;team=(team+1)%3;editor.innerHTML='';qimg.removeAttribute('src');imgwrap.style.display='none';editor.style.display='flex';render()}miss.onclick=()=>{kick.classList.remove('show');adv()};cont.onclick=()=>{win.classList.remove('show');adv()};next.onclick=adv;reset.onclick=()=>{scores=[0,0,0];team=0;q=1;editor.innerHTML='';render()};render();</script></body></html>
