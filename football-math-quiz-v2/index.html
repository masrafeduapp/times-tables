<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بطولة الرياضيات</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0a5ba6 0 29%,#08713d 29%);font-family:Tahoma,Arial,sans-serif;color:#fff;padding:12px 12px 96px}.app{max-width:1500px;margin:auto}.title{text-align:center;background:#063d2b;border:3px solid #e8bd45;border-radius:22px;padding:11px;font-size:clamp(24px,3vw,38px);font-weight:900;color:#ffd95b}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.player{height:250px;border-radius:24px;overflow:hidden;position:relative;border:4px solid transparent;cursor:pointer;box-shadow:0 12px 28px #0008;background:#0a3553}.player.sel{border-color:#fff;box-shadow:0 0 0 4px #e8bd45,0 12px 28px #0008;transform:translateY(-2px)}.portrait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px 8px 54px;background:linear-gradient(180deg,#123e68,#092c49)}.player:nth-child(2) .portrait{background:linear-gradient(180deg,#bb961a,#70580b)}.player:nth-child(3) .portrait{background:linear-gradient(180deg,#8a1727,#4f0d17)}.player img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block;filter:contrast(1.08) saturate(1.08);border-radius:16px;background:#ffffff12}.player:after{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,rgba(0,0,0,.92));pointer-events:none}.name{position:absolute;z-index:2;bottom:12px;right:10px;left:10px;text-align:center;font-size:clamp(19px,2vw,29px);font-weight:900;text-shadow:0 2px 5px #000}.score{position:absolute;z-index:3;top:12px;left:12px;width:64px;height:64px;display:grid;place-items:center;background:#111e;border:2px solid #fff;border-radius:16px;font-size:36px;font-weight:900}.arena{background:#0b6b40;border:4px solid #e8bd45;border-radius:28px;padding:16px}.qnum{width:max-content;margin:auto auto 12px;background:#063d2b;border:3px solid #e8bd45;border-radius:999px;padding:10px 30px;font-size:32px;font-weight:900}.board{background:#fff;color:#111;border:8px solid #0b5a3b;border-radius:30px;height:67vh;min-height:590px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 3px #e1bf59}.editor{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:clamp(34px,4vw,64px);font-weight:900;line-height:1.5;outline:none}.editor:empty:before{content:'اكتبي السؤال هنا أو الصقي النص';color:#9a9a9a}.imgwrap{display:none;width:100%;height:100%;align-items:center;justify-content:center;padding:18px}.imgwrap img{max-width:100%;max-height:100%;object-fit:contain}.toolbar{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;background:#063d2bf5;border:2px solid #e8bd45;border-radius:20px;padding:8px;z-index:20;box-shadow:0 10px 26px #0008}.toolbar button,.toolbar label{border:0;border-radius:13px;padding:12px 17px;font-size:16px;font-weight:900;cursor:pointer}.toolbar input{display:none}.gold{background:#e4b83f;color:#173021}.blue{background:#1478e8;color:#fff}.green{background:#0d6746;color:#fff}.overlay{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:50;padding:20px}.overlay.show{display:grid}.modal{width:min(740px,94vw);background:#063d2b;border:4px solid #e8bd45;border-radius:26px;padding:26px;text-align:center}.goalbox{height:280px;background:linear-gradient(#1680c4 0 62%,#15934f 62%);border-radius:18px;position:relative;overflow:hidden}.net{position:absolute;left:15%;right:15%;bottom:17%;height:48%;border:8px solid #fff}.ball{position:absolute;left:48%;bottom:15px;font-size:72px;transition:1s}.ball.go{transform:translate(190px,-140px) rotate(600deg)}.actions{display:flex;gap:10px;justify-content:center;margin-top:16px}.actions button{border:0;border-radius:13px;padding:13px 24px;font-size:21px;font-weight:900}.goal{background:#13a75a;color:#fff}.miss{background:#c82a3c;color:#fff}.win{font-size:clamp(64px,9vw,100px);color:#ffd34f;font-weight:1000}.lose{font-size:clamp(50px,7vw,78px);color:#ff6b78;font-weight:1000}@media(max-width:900px){body{padding:8px 8px 90px}.players{gap:8px}.player{height:210px}.portrait{padding:6px 6px 48px}.name{font-size:17px}.score{width:48px;height:48px;font-size:26px}.board{height:70vh;min-height:560px}.toolbar{width:calc(100% - 14px);justify-content:space-between}.toolbar button,.toolbar label{font-size:14px;padding:10px 12px}}@media(max-width:560px){.title{font-size:19px}.player{height:150px}.name{font-size:12px}.score{width:40px;height:40px;font-size:21px}.portrait{padding:4px 4px 42px}.board{min-height:440px}.hide{display:none}}</style></head><body><div class="app"><div class="title">⚽ بطولة الرياضيات — أ. سارة بنت مداوي حقوي</div><div class="players"><div class="player sel" data-team="0"><div class="portrait"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Salem_Al-Dawsari_%28Saudi_Arabia_v_Uruguay%2C_June_2026%29_%28cropped%29.jpg?width=1200" alt="سالم الدوسري"></div><div class="score" id="s0">٠</div><div class="name">مجموعة سالم الدوسري</div></div><div class="player" data-team="1"><div class="portrait"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/2025_Cristiano_Ronaldo_%28cropped%29.jpg?width=1200" alt="رونالدو"></div><div class="score" id="s1">٠</div><div class="name">مجموعة رونالدو</div></div><div class="player" data-team="2"><div class="portrait"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Kylian_Mbappe_at_Real_Madrid%27s_game_versus_Juventus_Turin_on_22_October_2025.jpeg?width=1200" alt="مبابي"></div><div class="score" id="s2">٠</div><div class="name">مجموعة مبابي</div></div></div><div class="arena"><div class="qnum" id="qnum">السؤال ١</div><div class="board"><div id="editor" class="editor" contenteditable="true"></div><div id="imgwrap" class="imgwrap"><img id="qimg" alt="صورة السؤال"></div></div></div></div><div class="toolbar"><button class="gold" id="textBtn">✍️ كتابة</button><label class="green">🖼️ صورة<input id="file" type="file" accept="image/*"></label><button class="blue" id="shoot">⚽ سدد</button><button class="green hide" id="next">التالي</button><button class="green hide" id="reset">إعادة النتائج</button></div><div class="overlay" id="kick"><div class="modal"><h1 id="teamTitle"></h1><div class="goalbox"><div class="net"></div><div class="ball" id="ball">⚽</div></div><div class="actions"><button class="goal" id="goal">🥅 هدف!</button><button class="miss" id="miss">✖ ضاعت</button></div></div></div><div class="overlay" id="win"><div class="modal"><div class="win">هـدف! 🏆</div><h1 id="winner"></h1><button class="blue" id="cont">التالي ←</button></div></div><div class="overlay" id="lose"><div class="modal"><div class="lose">ضاعت التسديدة</div><h2>حظ أوفر في السؤال القادم ⚽</h2><button class="green" id="loseCont">التالي ←</button></div></div><script>const names=['مجموعة سالم الدوسري','مجموعة رونالدو','مجموعة مبابي'];let scores=[0,0,0],team=0,q=1;const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);function render(){scores.forEach((v,i)=>document.getElementById('s'+i).textContent=ar(v));document.querySelectorAll('.player').forEach((p,i)=>p.classList.toggle('sel',i===team));qnum.textContent='السؤال '+ar(q)}document.querySelectorAll('.player').forEach(p=>p.onclick=()=>{team=+p.dataset.team;render()});textBtn.onclick=()=>{imgwrap.style.display='none';editor.style.display='flex';editor.focus()};file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{qimg.src=r.result;imgwrap.style.display='flex';editor.style.display='none'};r.readAsDataURL(f)};function tone(freq,start,dur,type='sine',gain=.12){const C=window.AudioContext||window.webkitAudioContext;window._ac=window._ac||new C();const ac=window._ac,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,ac.currentTime+start);g.gain.exponentialRampToValueAtTime(gain,ac.currentTime+start+.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+start+dur);o.connect(g).connect(ac.destination);o.start(ac.currentTime+start);o.stop(ac.currentTime+start+dur+.03)}function playWin(){tone(523,0,.22,'triangle',.14);tone(659,.18,.22,'triangle',.14);tone(784,.36,.24,'triangle',.15);tone(1047,.58,.5,'triangle',.17);tone(784,.63,.45,'sine',.06)}function playLose(){tone(330,0,.28,'sawtooth',.11);tone(247,.24,.32,'sawtooth',.11);tone(196,.5,.5,'sawtooth',.12)}shoot.onclick=()=>{teamTitle.textContent=names[team];kick.classList.add('show');ball.classList.remove('go');setTimeout(()=>ball.classList.add('go'),60)};goal.onclick=()=>{playWin();scores[team]++;kick.classList.remove('show');winner.textContent='ممتاز! '+names[team];win.classList.add('show');render()};function adv(){q++;team=(team+1)%3;editor.innerHTML='';qimg.removeAttribute('src');imgwrap.style.display='none';editor.style.display='flex';render()}miss.onclick=()=>{playLose();kick.classList.remove('show');lose.classList.add('show')};loseCont.onclick=()=>{lose.classList.remove('show');adv()};cont.onclick=()=>{win.classList.remove('show');adv()};next.onclick=adv;reset.onclick=()=>{scores=[0,0,0];team=0;q=1;editor.innerHTML='';render()};render();</script></body></html>
