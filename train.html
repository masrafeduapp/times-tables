<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قطار النواتج | أ. سارة حقوي</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(#081526,#142945);color:#fff;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:18px}.top{text-align:center}.top h1{font-size:clamp(30px,8vw,52px);margin:12px 0 5px}.top p{color:#cbd5e1}.panel{background:#ffffff10;border:1px solid #ffffff25;border-radius:24px;padding:18px;margin-top:16px}.q{text-align:center;font-size:clamp(42px,12vw,76px);font-weight:900;margin:8px}.track{height:210px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#7dd3fc22 0 64%,#475569 64% 70%,#1e293b 70%);border:1px solid #ffffff20}.train{position:absolute;bottom:34px;right:18px;font-size:62px;transition:.35s}.cart{display:inline-flex;align-items:center;justify-content:center;width:72px;height:52px;margin-right:-9px;border-radius:10px 10px 16px 16px;background:#fbbf24;color:#111;font-size:22px;font-weight:900;border:3px solid #fff}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.choice{min-height:64px;border:1px solid #ffffff28;border-radius:16px;background:#ffffff12;color:#fff;font:inherit;font-size:25px;font-weight:900}.choice:active{transform:scale(.97)}.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#ffffff10;border:1px solid #ffffff22;padding:7px 10px;border-radius:999px;font-weight:900}.feed{text-align:center;min-height:28px;margin:12px;font-weight:900}.back{display:block;text-align:center;color:#a7f3d0;margin:18px;text-decoration:none;font-weight:900}@media(max-width:520px){.wrap{padding:10px}.panel{padding:12px}.track{height:190px}.train{font-size:50px}.cart{width:58px;height:45px;font-size:18px}.choices{gap:7px}.choice{min-height:58px;font-size:22px}}</style></head><body><main class="wrap"><div class="top"><div>✦ أ. سارة حقوي ✦</div><h1>🚂 قطار النواتج</h1><p>حل المسألة واجمع الناتج الصحيح في عربة القطار.</p></div><section class="panel"><div class="info"><span class="pill" id="level">المرحلة ١</span><span class="pill" id="num">١ / ١٠</span><span class="pill" id="score">⭐ ٠</span></div><div class="q" id="q"></div><div class="track"><div class="train" id="train">🚂</div></div><div class="choices" id="choices"></div><div class="feed" id="feed"></div></section><a class="back" href="./">← العودة إلى مغامرات جدول الضرب</a></main><script>const A='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>A[d]),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let i=0,score=0,total=10,level=1,correct=0,carts=[];const $=x=>document.getElementById(x);function tone(f){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.2)}catch(e){}}function next(){if(i>=total)return finish();i++;level=Math.min(4,Math.floor((i-1)/3)+1);let pool=level<2?[6,7,8,9]:[7,8,9,10],a=pool[R(0,pool.length-1)],b=R(level>2?7:5,10);correct=a*b;$('q').textContent=ar(a)+' × '+ar(b)+' = ؟';$('level').textContent='المرحلة '+ar(level);$('num').textContent=ar(i)+' / '+ar(total);$('score').textContent='⭐ '+ar(score);$('feed').textContent='';let vals=new Set([correct]);while(vals.size<6)vals.add(Math.max(1,correct+(R(-9,9)||2)));let arr=[...vals].sort(()=>Math.random()-.5);$('choices').innerHTML='';arr.forEach(v=>{let x=document.createElement('button');x.className='choice';x.textContent=ar(v);x.onclick=()=>pick(v,x);$('choices').appendChild(x)})}function pick(v,b){[...$('choices').children].forEach(x=>x.disabled=true);if(v===correct){score++;tone(780);b.style.background='#34d39955';carts.push(v);draw();$('feed').textContent='🚂 ممتاز! تمت إضافة عربة جديدة';setTimeout(next,650)}else{tone(180);b.style.background='#fb718555';$('feed').textContent='حاول مرة أخرى؛ ابحث عن الناتج '+ar(correct);setTimeout(()=>{[...$('choices').children].forEach(x=>x.disabled=false);b.disabled=true},550)}}function draw(){let t=$('train');t.innerHTML='🚂'+carts.slice(-7).map(v=>'<span class="cart">'+ar(v)+'</span>').join('')}function finish(){$('q').textContent='وصل القطار! 🏁';$('choices').innerHTML='<button class="choice" style="grid-column:1/-1" id="again">جولة جديدة</button>';$('feed').textContent='جمعت '+ar(score)+' عربات صحيحة 🚂⭐';$('again').onclick=()=>{i=0;score=0;carts=[];draw();next()}}next();</script></body></html>
