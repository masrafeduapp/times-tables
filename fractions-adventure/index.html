<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>مغامرة الكسور</title><style>body{margin:0;overflow:hidden;font-family:Tahoma;background:#9fe9f6}#hud{position:absolute;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;gap:8px;z-index:2}#hud span,#q,#footer{background:#ffffffeb;border:3px solid #9575ff;border-radius:18px;padding:12px;color:#362565;font-weight:bold}#q{position:absolute;top:70px;right:12px;width:min(390px,calc(100% - 50px));z-index:3;text-align:center}#question{font-size:23px;margin:10px}button{font-family:inherit;font-weight:bold;font-size:20px;background:#ffe475;border:2px solid #9374f3;border-radius:12px;padding:12px;margin:4px;cursor:pointer}button:active{transform:scale(.95)}#move{position:absolute;bottom:60px;left:15px;z-index:4}#move button{width:65px;height:65px;background:#ffffffc9}#footer{position:absolute;bottom:8px;right:10px;font-size:13px;z-index:2}#notice{color:#7031c0;min-height:24px}</style><div id="hud"><span>🎮 مغامرة الكسور</span><span id="score">⭐ ٠</span><span id="level">المرحلة ١</span></div><div id="q"><div id="question"></div><div id="answers"></div><div id="notice"></div></div><div id="move"><button id="left">◀</button><button id="jump">⬆</button><button id="right">▶</button></div><div id="footer">الصف السادس الابتدائي | المعلمة سارة حقوي</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>const qs=[['حوّلي ٧/٤ إلى عدد كسري',['١ و٣/٤','٢ و١/٤','١ و١/٤'],0],['حوّلي ١ و٥/٨ إلى كسر غير فعلي',['١١/٨','١٣/٨','٦/٨'],1],['حوّلي ٩/٢ إلى عدد كسري',['٤ و١/٢','٣ و١/٢','٥ و١/٢'],0],['حوّلي ٢ و٢/٣ إلى كسر غير فعلي',['٦/٣','٨/٣','٧/٣'],1],['حوّلي ١١/٣ إلى عدد كسري',['٣ و٢/٣','٢ و٢/٣','٤ و١/٣'],0],['حوّلي ٣ و١/٤ إلى كسر غير فعلي',['١٢/٤','١٤/٤','١٣/٤'],2],['حوّلي ١٧/٥ إلى عدد كسري',['٢ و٣/٥','٣ و٢/٥','٤ و١/٥'],1],['حوّلي ٤ و٣/٧ إلى كسر غير فعلي',['٣١/٧','٢٨/٧','٣٠/٧'],0],['حوّلي ٢٣/٦ إلى عدد كسري',['٣ و٥/٦','٤ و١/٦','٣ و٤/٦'],0],['حوّلي ٥ و٢/٩ إلى كسر غير فعلي',['٤٥/٩','٤٧/٩','٥٢/٩'],1],['حوّلي ٢٩/٨ إلى عدد كسري',['٣ و٥/٨','٣ و٦/٨','٤ و٣/٨'],0],['حوّلي ٦ و٤/٥ إلى كسر غير فعلي',['٣٤/٥','٣٠/٥','٢٨/٥'],0]];let i=0,score=0,step=0;const ar=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[+d]);const scene=new THREE.Scene();scene.background=new THREE.Color('#a2f4ed');scene.fog=new THREE.Fog('#a2f4ed',18,70);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x79b1c3,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,15,6);scene.add(sun);function cube(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.7}));m.position.set(x,y,z);scene.add(m);return m}cube(200,.2,200,'#62d7db',0,-1.4,-25);for(let j=0;j<30;j++){cube(3,.5,3,['#ffe46a','#a0f8ff','#c8a2ff','#9bf4a5'][j%4],Math.sin(j*.55)*2,0,-j*3);if(j%3===0){const trunk=cube(.5,2,.5,'#9d6742',6,-.2,-j*3);const leaf=new THREE.Mesh(new THREE.SphereGeometry(1.6,12,12),new THREE.MeshStandardMaterial({color:'#54d86c'}));leaf.position.set(6,1.5,-j*3);scene.add(leaf)}}const person=new THREE.Group();person.add(cube(.85,1,.6,'#3b83ee',0,1,0));const head=new THREE.Mesh(new THREE.SphereGeometry(.4,16,16),new THREE.MeshStandardMaterial({color:'#f7d3a2'}));head.position.y=1.85;person.add(head);scene.add(person);function update(){document.getElementById('question').textContent=qs[i][0];document.getElementById('answers').innerHTML='';qs[i][1].forEach((a,k)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(k);document.getElementById('answers').appendChild(b)});document.getElementById('level').textContent='المرحلة '+ar(i+1);document.getElementById('score').textContent='⭐ '+ar(score)}function answer(k){if(k!==qs[i][2]){document.getElementById('notice').textContent='حاولي مرة أخرى 💜';return}score+=100;step++;person.position.z=-step*3;document.getElementById('notice').textContent='أحسنتِ! 🎉';if(i===qs.length-1){document.getElementById('q').innerHTML='<h2>🏆 مبروك الفوز!</h2><p>أنهيتِ جميع مراحل مغامرة الكسور</p><button onclick="location.reload()">إعادة اللعب</button>';return}i++;setTimeout(()=>{update();document.getElementById('notice').textContent=''},550)}document.getElementById('left').onclick=()=>person.position.x=Math.max(-2,person.position.x-.5);document.getElementById('right').onclick=()=>person.position.x=Math.min(2,person.position.x+.5);document.getElementById('jump').onclick=()=>{person.position.y=1;setTimeout(()=>person.position.y=0,350)};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')document.getElementById('left').click();if(e.key==='ArrowRight')document.getElementById('right').click();if(e.key===' ')document.getElementById('jump').click()});function animate(){requestAnimationFrame(animate);camera.position.lerp(new THREE.Vector3(person.position.x,5,person.position.z+9),.08);camera.lookAt(person.position.x,0,person.position.z-7);renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});update();animate();</script></html>
